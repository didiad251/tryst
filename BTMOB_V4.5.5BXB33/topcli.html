<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients Manager</title>

    <style>
             :root {
                 --bg: #060a0f;
                 --panel: #0e1621;
                 --muted: #91a3b6;
                 --text: #e6edf3;
                 --accent: #02b075;
                 --accent-2: #26d8a7;
                 --border: #1a2533;
                 --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                 --radius: 14px;
             }

             * {
                 box-sizing: border-box;
                 -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
                 -webkit-tap-highlight-color: transparent;
                 -webkit-user-select: none;
                 -khtml-user-select: none;
                 -moz-user-select: none;
                 -ms-user-select: none;
                 user-select: none;
             }

             body {
                 margin: 0;
                 padding: 0px;
                 overflow: hidden;
                 font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
                 background: var(--bg);
                 color: var(--text);
                 height: 100vh;
             }

             .wrap {
                 padding: 5px;
                 border-radius: var(--radius);
                 margin-left: 6px;
                 display: flex;
                 flex-direction: column;
                 gap: 5px;
             }

             /* -------------- HEADER LAYOUT A -------------- */

             .header {
                 display: flex;
                 align-items: center;
                 gap: 15px;
                 width: 100%;
                 padding: 4px 4px 4px;
             }

             .leftside {
                 display: flex;
                 align-items: center;
                 gap: 12px;
                 flex-shrink: 0;
             }

             .logo {
                 width: 44px;
                 height: 44px;
                 border-radius: var(--radius);
                 display: grid;
                 place-items: center;
                 background: conic-gradient(from 220deg at 50% 50%, rgba(2, 176, 117, 0.25), rgba(38, 216, 167, 0.15), rgba(2, 176, 117, 0.25));
                 border: 1px solid color-mix(in hsl, var(--accent) 35%, #0b1220);
                 box-shadow: var(--shadow);
             }

             .title {
                 font-size: 1.25rem;
                 font-weight: 800;
                 color: var(--accent);
             }

             /* CENTER SEARCH BAR */
             .center {
                 flex: 1;
                 display: flex;
                 justify-content: center;
             }

             .searchbox {
                 position: relative;
                 width: 100%;
                 max-width: 420px;
             }

                 .searchbox input {
                     width: 100%;
                     background: #161b22;
                     border: 1px solid #242a33;
                     border-radius: 8px;
                     color: #ccc;
                     font-size: 0.9rem;
                     padding: 8px 12px 8px 35px;
                     outline: none;
                 }

                 .searchbox .icon {
                     position: absolute;
                     left: 10px;
                     top: 8px;
                     width: 16px;
                     height: 16px;
                 }

             /* RIGHT SIDE BUTTONS */
             .rightside {
                 display: flex;
                 gap: 10px;
                 flex-wrap: wrap;
                 justify-content: flex-end;
                 flex-shrink: 0;
             }

                 .rightside button {
                     width: 80px;
                     height: 60px;
                     font-size: 10.5px;
                     font-weight: bold;
                     background: var(--panel);
                     border: 1px solid var(--border);
                     border-radius: var(--radius);
                     display: flex;
                     flex-direction: column;
                     justify-content: center;
                     align-items: center;
                     gap: 4px;
                     color: var(--muted);
                     cursor: pointer;
                     transition: 0.2s ease;
                 }

                     .rightside button:hover {
                         color: var(--accent-2);
                         fill: var(--accent-2);
                         border-color: var(--accent-2);
                         box-shadow: 0 0 10px var(--accent-2);
                     }

                     .rightside button svg {
                         width: 18px;
                         height: 18px;
                     }

             /* MOBILE - STACK CLEANLY */
             @media (max-width: 900px) {
                 .header {
                     flex-wrap: wrap;
                 }

                 .center {
                     order: 3;
                     width: 100%;
                 }

                 .rightside {
                     order: 2;
                     width: 100%;
                     justify-content: center;
                 }
             }

             /* ===============================
        CHIPS SECTION
        =============================== */

             /* ===============================
        CHIPS SECTION — RESPONSIVE
        =============================== */

             .chipsbox {
                 width: 100%;
                 margin-top: 5px;
                 padding: 8px 12px;
                 background: var(--panel);
                 border-radius: var(--radius);
                 border: 1px solid var(--border);
                 box-shadow: 0 0 12px rgba(38, 216, 167, 0.06);
                 display: flex;
                 flex-wrap: wrap;
                 align-items: center;
                 gap: 8px;
                 /* auto height until chips exceed ~2 rows */
                 max-height: 60px;
                 overflow-y: auto;
             }

                 /* hide scrollbar */
                 .chipsbox::-webkit-scrollbar {
                     width: 0;
                 }

             /* CHIP ITEM */
             .chip {
                 display: inline-flex;
                 align-items: center;
                 gap: 6px;
                 padding: 6px 10px;
                 background: #122028;
                 border: 1px solid #1d2c37;
                 border-radius: 999px;
                 font-size: 0.78rem;
                 white-space: nowrap;
                 color: var(--text);
                 transition: background 0.2s;
             }

                 .chip:hover {
                     background: #182a36;
                 }

             /* Status dots */
             .status-dot {
                 width: 10px;
                 height: 10px;
                 border-radius: 50%;
             }

             .status-online {
                 background: #00d97e;
             }

             .status-offline {
                 background: #ff4d4d;
             }

             .status-pending {
                 background: #ffaa33;
             }

             /* Responsive improvement */
             @media (max-width: 600px) {
                 .chipsbox {
                     max-height: 160px;
                     justify-content: center;
                     /* or "flex-start" depending on your taste */
                 }
             }

             .flg {
                 width: 18px;
                 height: 18px;
                 border-radius: 50%;
             }
    </style>
</head>

<script>
    (function () {
        function clean(value) {
            return String(value == null ? "" : value);
        }

        function htmlText(value) {
            return clean(value).replace(/[&<>"']/g, function (ch) {
                return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch];
            });
        }

        function safeId(value) {
            return clean(value).trim().replace(/[^\w-]/g, "_");
        }

        function stateColor(state) {
            var key = clean(state).toLowerCase();
            if (key === "requested") return "#ffaa33";
            if (key === "updated") return "#02b075";
            return "#91a3b6";
        }

        if (typeof window.addClient !== "function") {
            window.addClient = function (wallpaper, address, name, version, updatedState, mobid, tagState) {
                if (typeof window.updateOrAddChip !== "function") return;

                var id = safeId(mobid) || safeId(address) || safeId(name);
                if (!id) return;

                var label = htmlText(name || address || id);
                var apkVersion = htmlText(version || "");
                window.updateOrAddChip(id, stateColor(updatedState), label, apkVersion || "0", "online", clean(wallpaper));

                var chip = document.getElementById("chip_" + id);
                if (!chip) return;

                chip.dataset.mobid = clean(mobid);
                chip.dataset.address = clean(address);
                chip.dataset.version = clean(version);
                chip.dataset.tag = clean(tagState);

                var valueEl = chip.querySelector(".chip-value");
                if (valueEl) {
                    valueEl.title = [clean(address), clean(tagState)].filter(Boolean).join(" | ") || "Connected clients";
                }

                var pingEl = chip.querySelector(".ping-label");
                if (pingEl && apkVersion) {
                    pingEl.textContent = clean(version);
                    pingEl.title = "Version: " + clean(version);
                }
            };
        }
    })();
</script>
